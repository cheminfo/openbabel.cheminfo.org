name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      # The backend shells out to obabel, so the conversions the suite drives
      # need the binary on the runner.
      - run: sudo apt-get install -y --no-install-recommends openbabel
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test-e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
